name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/suhsug?schema=public
      ADMIN_SESSION_SECRET: ci-only-secret-value-with-at-least-32-characters
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD_HASH: $2b$12$C6UzMDM.H6dfI/f/IKcEe.6b3e9X6qVqV3gV0YxJz3p9KqGxY9zVxK
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: suhsug
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d suhsug"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
